# Ajustes comunes de FlatLaf (tema claro y oscuro) para la aplicación de la clínica.
# Se cargan con FlatLaf.registerCustomDefaultsSource("sv.edu.udb.clinica.ui.tema").

# --- Formas redondeadas ---
Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 12
ScrollBar.trackArc = 999

# --- Foco y espaciado ---
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.margin = 6,16,6,16
TextField.margin = 5,10,5,10
ComboBox.padding = 4,8,4,8
ToolTip.border = 6,10,6,10

# --- Tablas ---
Table.rowHeight = 36
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
TableHeader.height = 38
Table.cellMargins = 2,10,2,10
TableHeader.cellMargins = 4,10,4,10
TableHeader.showVerticalLines = false

# --- Diálogos y mensajes ---
OptionPane.buttonMinimumWidth = 90
